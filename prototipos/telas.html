<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Pro Nutri — telas de exemplo</title>
<style>:root{--canvas:#fffbf3;--surface:#ffffff;--surface-low:#f4f0e6;--surface-container:#ece7dc;--ink:#1d2820;--ink-muted:#5a675e;--outline:#66746a;--outline-variant:#e4ded2;--primary:#197c3d;--on-primary:#ffffff;--primary-container:#d4f2dc;--on-primary-container:#155a2d;--secondary:#9b6038;--secondary-container:#fbe2cc;--on-secondary-container:#6b3a17;--danger:#b3261e;--on-danger:#ffffff;--danger-container:#fbdedb;--on-danger-container:#8c1d18;--scrim:rgba(29, 40, 32, 0.4);--shadow-overlay:0 12px 32px rgba(29, 40, 32, 0.16);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--radius-sm:10px;--radius-md:18px;--radius-lg:26px;--radius-pill:999px;--border-hairline:1px;--border-card:1.5px;--border-focus:2px;--control-height:44px;--sidebar-width:280px;--content-max:1120px;--font-sans:"Figtree", "Segoe UI", system-ui, sans-serif;}
:root[data-theme=dark]{--canvas:#0e1513;--surface:#151d19;--surface-low:#1a231f;--surface-container:#232d28;--ink:#e3ece5;--ink-muted:#a6b3aa;--outline:#86948a;--outline-variant:#2f3a34;--primary:#7fd99b;--on-primary:#00391a;--primary-container:#1f5a33;--on-primary-container:#c8f0d3;--secondary:#f0b48a;--secondary-container:#5a3519;--on-secondary-container:#ffdcc4;--danger:#ffb4ab;--on-danger:#690005;--danger-container:#7a1d18;--on-danger-container:#ffdad6;--scrim:rgba(0, 0, 0, 0.6);--shadow-overlay:0 0 0 1px rgba(227, 236, 229, 0.16), 0 16px 40px rgba(0, 0, 0, 0.72);}</style>
<style>@import url("https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap");

/* Prato em Dia — Portal Pro Nutri components. Every value reads a token from tokens.json. */
body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 1.45; margin: 0; -webkit-font-smoothing: antialiased; }
.pd-icon { flex: none; display: inline-block; vertical-align: middle; }
.pd-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pd-muted { color: var(--ink-muted); }
:where(.pd-btn, .pd-navitem, .pd-tab, .pd-iconbtn, .pd-field__input, .pd-policy__opt):focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }

/* Button */
.pd-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--control-height); padding: 0 var(--space-5); border-radius: var(--radius-md); border: var(--border-hairline) solid transparent; font: 600 14px/20px var(--font-sans); cursor: pointer; transition: background-color .15s ease-out, border-color .15s ease-out; white-space: nowrap; }
.pd-btn--sm { min-height: 36px; padding: 0 var(--space-4); }
.pd-btn--primary { background: var(--primary); color: var(--on-primary); }
.pd-btn--primary:hover:not(:disabled) { background: var(--on-primary-container); }
.pd-btn--tonal { background: var(--primary-container); color: var(--on-primary-container); }
.pd-btn--tonal:hover:not(:disabled) { border-color: var(--primary); }
.pd-btn--outline { background: var(--surface); color: var(--ink); border-color: var(--outline); }
.pd-btn--outline:hover:not(:disabled) { background: var(--surface-low); }
.pd-btn--ghost { background: transparent; color: var(--primary); }
.pd-btn--ghost:hover:not(:disabled) { background: var(--surface-low); }
.pd-btn--danger { background: var(--danger); color: var(--on-danger); }
.pd-btn:disabled { cursor: not-allowed; }
.pd-btn:disabled:not(.is-loading) { background: var(--surface-container); color: var(--ink-muted); border-color: transparent; }
.pd-spinner { width: 16px; height: 16px; border-radius: var(--radius-pill); border: 2px solid currentColor; border-right-color: transparent; animation: pd-spin .8s linear infinite; flex: none; }
.pd-spinner--sm { width: 12px; height: 12px; }
@keyframes pd-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .pd-spinner { animation-duration: 2.4s; } }

/* StatusChip */
.pd-chip { display: inline-flex; align-items: center; gap: var(--space-1); min-height: 26px; padding: 0 var(--space-3) 0 10px; border-radius: var(--radius-pill); font: 600 12px/16px var(--font-sans); white-space: nowrap; }
.pd-chip--success { background: var(--primary-container); color: var(--on-primary-container); }
.pd-chip--warm { background: var(--secondary-container); color: var(--on-secondary-container); }
.pd-chip--danger { background: var(--danger-container); color: var(--on-danger-container); }
.pd-chip--neutral { background: var(--surface-container); color: var(--ink-muted); }

/* TextField */
.pd-field { display: flex; flex-direction: column; gap: var(--space-2); }
.pd-field__label { font: 600 14px/20px var(--font-sans); color: var(--ink); }
.pd-field__control { position: relative; display: flex; }
.pd-field__icon { position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); color: var(--ink-muted); pointer-events: none; }
.pd-field__input { flex: 1; min-height: var(--control-height); box-sizing: border-box; padding: 10px var(--space-4); border-radius: var(--radius-md); border: var(--border-hairline) solid var(--outline); background: var(--surface); color: var(--ink); font: 400 16px/1.45 var(--font-sans); }
textarea.pd-field__input { min-height: 96px; resize: vertical; }
.pd-field__input.has-icon { padding-left: 44px; }
.pd-field__input::placeholder { color: var(--ink-muted); }
.pd-field__input:focus-visible { outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.pd-field.is-error .pd-field__input { border-color: var(--danger); }
.pd-field__hint { display: flex; align-items: center; gap: var(--space-1); margin: 0; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.pd-field__hint--error { color: var(--danger); }

/* Tabs */
.pd-tabs { display: flex; gap: var(--space-6); border-bottom: var(--border-hairline) solid var(--outline-variant); }
.pd-tab { position: relative; display: inline-flex; align-items: center; gap: var(--space-2); background: none; border: 0; padding: var(--space-3) 0; font: 600 14px/20px var(--font-sans); color: var(--ink-muted); cursor: pointer; }
.pd-tab:hover { color: var(--ink); }
.pd-tab.is-selected { color: var(--ink); }
.pd-tab.is-selected::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: var(--radius-pill); background: var(--primary); }
.pd-tab__count { min-width: 20px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--surface-container); font: 600 12px/20px var(--font-sans); text-align: center; color: var(--ink-muted); }

/* SideNav */
.pd-sidenav { display: flex; flex-direction: column; gap: var(--space-6); width: var(--sidebar-width); box-sizing: border-box; min-height: 100%; padding: var(--space-6); background: var(--surface-low); border-right: var(--border-hairline) solid var(--outline-variant); }
.pd-brand { display: flex; align-items: center; gap: var(--space-3); }
.pd-brand__mark { width: 48px; height: 48px; flex: none; }
.pd-brand__name { font: 700 18px/22px var(--font-sans); color: var(--ink); letter-spacing: -0.2px; }
.pd-brand__sub { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.pd-sidenav__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); }
.pd-navitem { display: flex; align-items: center; gap: var(--space-3); min-height: var(--control-height); padding: 0 var(--space-4); border-radius: var(--radius-md); color: var(--ink-muted); font: 600 15px/20px var(--font-sans); text-decoration: none; transition: background-color .15s ease-out; }
.pd-navitem:hover { background: var(--surface-container); color: var(--ink); }
.pd-navitem.is-selected { background: var(--primary-container); color: var(--on-primary-container); }
.pd-sidenav__user { margin-top: auto; display: flex; align-items: center; gap: var(--space-3); padding-top: var(--space-4); border-top: var(--border-hairline) solid var(--outline-variant); }
.pd-avatar { width: 36px; height: 36px; flex: none; border-radius: var(--radius-pill); background: var(--primary-container); color: var(--on-primary-container); display: grid; place-items: center; font: 700 13px/1 var(--font-sans); }
.pd-sidenav__who { flex: 1; min-width: 0; }
.pd-sidenav__uname { font: 600 14px/20px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pd-sidenav__reg { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.pd-iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); cursor: pointer; }
.pd-iconbtn:hover { background: var(--surface-container); color: var(--ink); }

/* PatientHeader */
.pd-phead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
.pd-phead__name { margin: 0; font: 700 26px/1.2 var(--font-sans); letter-spacing: -0.3px; color: var(--ink); }
.pd-phead__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); margin-top: var(--space-2); color: var(--ink-muted); }
.pd-phead__desc { margin: var(--space-2) 0 0; color: var(--ink-muted); }
.pd-phead__actions { display: flex; flex-wrap: wrap; gap: var(--space-3); }

/* MetricTile */
.pd-metric { padding: var(--space-4) var(--space-5); background: var(--surface); border: var(--border-card) solid var(--outline-variant); border-radius: var(--radius-lg); }
.pd-metric__label { font: 500 14px/20px var(--font-sans); color: var(--ink-muted); }
.pd-metric__value { margin-top: var(--space-2); font: 700 28px/32px var(--font-sans); letter-spacing: -0.3px; font-variant-numeric: tabular-nums; color: var(--ink); }
.pd-metric__unit { font-size: 18px; font-weight: 600; }
.pd-metric__hint { margin-top: var(--space-1); font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }

/* MealTable */
.pd-tablewrap { overflow-x: auto; background: var(--surface); border: var(--border-card) solid var(--outline-variant); border-radius: var(--radius-lg); }
.pd-table { width: 100%; border-collapse: collapse; font: 400 14px/1.45 var(--font-sans); }
.pd-table th { background: var(--surface-container); text-align: left; padding: var(--space-3) var(--space-4); font: 600 12px/16px var(--font-sans); letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.pd-table td { padding: var(--space-3) var(--space-4); border-top: var(--border-hairline) solid var(--outline-variant); vertical-align: middle; }
.pd-table tbody tr:hover td { background: var(--surface-low); }
.pd-table .is-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pd-table__meal { font-weight: 600; color: var(--ink); }
.pd-table__items { color: var(--ink-muted); font-size: 13px; }

/* VersionHistory */
.pd-versions { list-style: none; margin: 0; padding: 0; }
.pd-version { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-top: var(--border-hairline) solid var(--outline-variant); }
.pd-version:first-child { border-top: 0; }
.pd-version__num { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: var(--radius-pill); background: var(--surface-container); font: 700 13px/1 var(--font-sans); color: var(--ink-muted); }
.pd-version.is-current .pd-version__num { background: var(--primary); color: var(--on-primary); }
.pd-version__body { flex: 1; min-width: 0; }
.pd-version__title { font-weight: 600; }
.pd-version__meta { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }

/* PolicyPicker */
.pd-policy { border: 0; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.pd-policy__legend { padding: 0; margin-bottom: var(--space-3); font: 600 14px/20px var(--font-sans); }
.pd-policy__opt { position: relative; display: flex; gap: var(--space-3); padding: var(--space-4); background: var(--surface); border: var(--border-card) solid var(--outline-variant); border-radius: var(--radius-md); cursor: pointer; }
.pd-policy__opt:hover { border-color: var(--outline); }
.pd-policy__opt.is-selected { border-color: var(--primary); background: var(--surface); box-shadow: inset 0 0 0 1px var(--primary); }
.pd-policy__opt input { position: absolute; opacity: 0; }
.pd-policy__opt:has(input:focus-visible) { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
.pd-policy__dot { width: 20px; height: 20px; flex: none; margin-top: 1px; box-sizing: border-box; border-radius: var(--radius-pill); border: 2px solid var(--outline); }
.pd-policy__opt.is-selected .pd-policy__dot { border: 6px solid var(--primary); }
.pd-policy__title { display: flex; align-items: center; gap: var(--space-2); font: 600 15px/20px var(--font-sans); color: var(--ink); }
.pd-policy__tag { padding: 2px var(--space-2); border-radius: var(--radius-pill); background: var(--primary-container); color: var(--on-primary-container); font: 600 11px/14px var(--font-sans); }
.pd-policy__body { display: block; margin-top: 2px; color: var(--ink-muted); }

/* WeekSummary */
.pd-week { padding: var(--space-5); background: var(--surface); border: var(--border-card) solid var(--outline-variant); border-radius: var(--radius-lg); }
.pd-week__head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.pd-week__title { font: 700 18px/24px var(--font-sans); }
.pd-week__sub { color: var(--ink-muted); }
.pd-week__planned { color: var(--ink-muted); }
.pd-week__planned .pd-week__n { font-size: 18px; color: var(--ink); }
.pd-week__grid { list-style: none; margin: var(--space-4) 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3); }
.pd-week__cell { display: flex; flex-direction: column; align-items: stretch; gap: var(--space-2); min-width: 0; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--surface-low); }
.pd-week__cell .pd-week__n { text-align: right; }
.pd-week__label { display: flex; align-items: flex-start; gap: var(--space-2); min-width: 0; font: 600 14px/20px var(--font-sans); color: var(--ink); }
.pd-week__label .pd-icon { margin-top: 2px; }
.pd-week__cell--success .pd-icon { color: var(--primary); }
.pd-week__cell--warm .pd-icon { color: var(--secondary); }
.pd-week__cell--danger .pd-icon { color: var(--danger); }
.pd-week__cell--neutral .pd-icon { color: var(--ink-muted); }
.pd-week__n { font: 700 24px/28px var(--font-sans); font-variant-numeric: tabular-nums; color: var(--ink); }

/* Alert */
.pd-alert { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); }
.pd-alert > .pd-icon { margin-top: 1px; }
.pd-alert__body { flex: 1; min-width: 0; }
.pd-alert__title { font-weight: 700; }
.pd-alert__action { align-self: center; }
.pd-alert--info { background: var(--surface-low); color: var(--ink); border: var(--border-hairline) solid var(--outline-variant); }
.pd-alert--success { background: var(--primary-container); color: var(--on-primary-container); }
.pd-alert--warm { background: var(--secondary-container); color: var(--on-secondary-container); }
.pd-alert--danger { background: var(--danger-container); color: var(--on-danger-container); }
.pd-alert--danger .pd-btn--outline { border-color: var(--on-danger-container); }

/* EmptyState */
.pd-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-2); padding: var(--space-10) var(--space-6); background: var(--surface); border: var(--border-card) dashed var(--outline-variant); border-radius: var(--radius-lg); }
.pd-empty__icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--radius-pill); background: var(--surface-low); color: var(--ink-muted); margin-bottom: var(--space-2); }
.pd-empty__title { font: 700 18px/24px var(--font-sans); }
.pd-empty__body { margin: 0 0 var(--space-3); max-width: 420px; color: var(--ink-muted); }

/* ConfirmDialog */
.pd-scrim { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: var(--space-4); background: var(--scrim); }
.pd-scrim.is-inline { position: relative; inset: auto; min-height: 100%; box-sizing: border-box; }
.pd-dialog { width: 100%; max-width: 460px; box-sizing: border-box; padding: var(--space-6); background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay); }
.pd-dialog__title { margin: 0; font: 700 18px/24px var(--font-sans); }
.pd-dialog__body { margin-top: var(--space-2); color: var(--ink-muted); }
.pd-dialog__body p { margin: 0 0 var(--space-2); }
.pd-dialog__actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-6); }

/* SaveStatus */
.pd-save { display: inline-flex; align-items: center; gap: var(--space-2); font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.pd-save--saved .pd-icon { color: var(--primary); }
.pd-save--error { color: var(--danger); }

@media (max-width: 900px) {
  .pd-sidenav { width: 100%; min-height: 0; flex-direction: row; flex-wrap: wrap; align-items: center; padding: var(--space-3) var(--space-4); border-right: 0; border-bottom: var(--border-hairline) solid var(--outline-variant); }
  .pd-sidenav__list { flex-direction: row; flex-wrap: wrap; }
  .pd-sidenav__user { display: none; }
}
</style>
<style>
  .scr-shell { display:flex; height:820px; background:var(--canvas); overflow:hidden; }
  .scr-shell > .pd-sidenav { flex:none; height:100%; }
  .scr-main { flex:1; min-width:0; overflow:auto; padding:var(--space-8); box-sizing:border-box; }
  .scr-inner { max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-6); }
  .scr-crumb { display:flex; align-items:center; gap:var(--space-1); font:500 13px/18px var(--font-sans); color:var(--ink-muted); }
  .scr-crumb a { color:var(--primary); text-decoration:none; font-weight:600; }
  .scr-h1 { margin:0; font:700 26px/1.2 var(--font-sans); letter-spacing:-0.3px; }
  .scr-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--space-4); }
  .scr-grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-5); }
  .scr-cols { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:var(--space-5); align-items:start; }
  .scr-stack { display:flex; flex-direction:column; gap:var(--space-5); }
  .scr-card { background:var(--surface); border:var(--border-card) solid var(--outline-variant); border-radius:var(--radius-lg); padding:var(--space-5); }
  .scr-card h2 { margin:0 0 var(--space-3); font:700 18px/24px var(--font-sans); }
  .scr-over { margin:0 0 var(--space-3); font:600 12px/16px var(--font-sans); letter-spacing:.6px; text-transform:uppercase; color:var(--ink-muted); }
  .scr-muted { color:var(--ink-muted); }
  .scr-note { margin:0; font:400 16px/1.45 var(--font-sans); color:var(--ink); }
  .scr-who { font-weight:600; color:var(--ink); }
  .scr-sub { font:400 13px/18px var(--font-sans); color:var(--ink-muted); }
</style>
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--canvas); }
  .proto-bar { flex: none; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--surface); border-bottom: var(--border-hairline) solid var(--outline-variant); }
  .proto-bar strong { margin-right: var(--space-4); font: 700 15px/20px var(--font-sans); }
  .proto-tab { min-height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-pill); border: var(--border-hairline) solid var(--outline-variant); background: var(--surface); color: var(--ink-muted); font: 600 14px/20px var(--font-sans); cursor: pointer; }
  .proto-tab[aria-pressed=true] { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }
  .proto-tab:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
  .proto-theme { margin-left: auto; }
  .proto-hide { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--ink-muted); cursor: pointer; opacity: .45; transition: opacity .15s ease-out, background-color .15s ease-out; }
  .proto-hide:hover, .proto-hide:focus-visible { opacity: 1; background: var(--surface-low); color: var(--ink); }
  .proto-hide:focus-visible, .proto-show:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
  .proto-stage { flex: 1; min-height: 0; }
  .proto-screen { height: 100%; }
  .proto-screen[hidden] { display: none; }
  .proto-screen .scr-shell { height: 100%; }
  body.bar-hidden .proto-bar { display: none; }
  .proto-show { position: fixed; top: var(--space-3); right: var(--space-3); z-index: 20; display: none; align-items: center; gap: var(--space-1); min-height: 32px; padding: 0 var(--space-3); border: var(--border-hairline) solid var(--outline-variant); border-radius: var(--radius-pill); background: var(--surface); color: var(--ink); font: 600 12px/16px var(--font-sans); box-shadow: var(--shadow-overlay); cursor: pointer; opacity: .75; transition: opacity .15s ease-out; }
  .proto-show:hover, .proto-show:focus-visible { opacity: 1; }
  body.bar-hidden .proto-show { display: inline-flex; }

<script>
  document.querySelectorAll('.proto-tab[data-target]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.proto-tab[data-target]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      document.querySelectorAll('.proto-screen').forEach(function (s) { s.hidden = s.dataset.screen !== b.dataset.target; });
    });
  });
  var themeBtn = document.getElementById('proto-theme');
  themeBtn.addEventListener('click', function () {
    var dark = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    themeBtn.textContent = dark ? 'Tema claro' : 'Tema escuro';
  });
  function setBar(hidden) {
    document.body.classList.toggle('bar-hidden', hidden);
    try { localStorage.setItem('proto-bar-hidden', hidden ? '1' : '0'); } catch (e) {}
  }
  try { if (localStorage.getItem('proto-bar-hidden') === '1') setBar(true); } catch (e) {}
  document.getElementById('proto-hide').addEventListener('click', function () { setBar(true); });
  document.getElementById('proto-show').addEventListener('click', function () { setBar(false); });
  document.addEventListener('keydown', function (e) {
    var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (e.key === '`' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); setBar(!document.body.classList.contains('bar-hidden')); }
  });
</script>
